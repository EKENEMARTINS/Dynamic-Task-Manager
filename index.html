<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ekene Martins Okoro — a simple task manager to create, organise and track daily tasks, with categories, due dates and localStorage saving.">
    <meta name="theme-color" content="#10131c">
    <meta name="author" content="Ekene Martins Okoro">
    <title>My Tasks | Dynamic Task Manager — Ekene Martins Okoro</title>
    <link rel="icon" href="assets/task-logo.webp">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
    <script defer src="assets/script.js"></script>

</head>

<body>
    <main class="app" id="top">
        <header class="app-header">
            <div class="header-brand">
                <img class="app-logo" src="assets/task-logo.webp" alt="Task manager logo" width="84" height="48">
                    <div>
                        <p class="eyebrow">EKENE MARTINS OKORO</p>
                        <h1>My Tasks</h1>
                        <p class="app-subtitle">Plan it. Do it. Tick it off.</p>
                    </div>
            </div>
            <p class="today" id="todayDate"></p>

            <button id="themeToggle" class="icon-button theme-toggle" type="button" aria-label="Switch to light theme">
                <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
            </button>
        </header>


        <section class="stats" aria-label="Task progress">
            <div class="stat-card">
                <span class="stat-number" id="totalCount">0</span>
                <span class="stat-label">Total tasks</span>
            </div>

            <div class="stat-card">
                <span class="stat-number" id="activeCount">0</span>
                <span class="stat-label">Active</span>
            </div>

            <div class="stat-card">
                <span class="stat-number" id="completedCount">0</span>
                <span class="stat-label">Completed</span>
            </div>

            <div class="stat-card stat-progress">
                <span class="stat-number" id="progressPercent">0%</span>
                <span class="stat-label">Complete</span>
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            </div>
        </section>

        <section class="add-task panel" aria-label="Add a new task">
            <h2>Add a new task</h2>
                <form id="taskForm">
                    <div class="form-row">
                        <label for="taskTitle">Task</label>
                        <input type="text" id="taskTitle" name="taskTitle" placeholder="What do you need to do?" required maxlength="120">
                    </div>

                    <div class="form-row">
                        <label for="taskCategory">Category</label>
                        <select id="taskCategory" name="taskCategory">
                            <option value="Work">Work</option>
                            <option value="Personal">Personal</option>
                            <option value="Study">Study</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="taskDueDate">Due date</label>
                        <input type="date" id="taskDueDate" name="taskDueDate">
                    </div>

                    <button class="button button-primary" type="submit">Add task +</button>
                </form>
        </section>

        <section class="toolbar" aria-label="Filter and search tasks">
            <div class="filters" id="filterButtons" role="group" aria-label="Filter tasks by status">
                <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">All</button>
                <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
                <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
            </div>

            <div class="search-row">
                <label class="visually-hidden" for="searchInput">Search tasks</label>
                <input type="search" id="searchInput" placeholder="Search tasks..." autocomplete="off">
            </div>
        </section>

        <section class="task-list-section" aria-label="Your tasks">
            <ul class="task-list" id="taskList"></ul>

            <p class="empty-state" id="emptyState">No tasks yet. Add your first task above to get started.</p>

            <button class="button button-secondary" type="button" id="clearCompleted">Clear completed</button>
        </section>
    </main>

    <footer class="app-footer">
        <a class="footer-brand" href="#top">
            <img src="assets/task-logo.webp" alt="EMO task manager logo" width="56" height="32">
            <span>Ekene Martins Okoro</span>
        </a>
        <p>Designed &amp; built with curiosity. © <span id="year">2026</span> Ekene Martins Okoro.</p>
        <a class="footer-top-link" href="#top">Back to top ↑</a>
    </footer>

    <button id="backToTop" class="back-to-top" type="button" aria-label="Back to top">↑</button>

</body>
</html>
